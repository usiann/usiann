<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重設密碼｜usiann</title>
    <link rel="stylesheet" href="style.css?v=8">
</head>

<body>

    <!-- 網站標題（點了回首頁） -->
    <header>
        <h1><a href="index.html" class="home-link">usiann ⋆˚꩜｡</a></h1>
        <p>有啥？</p>
    </header>

    <main class="form-page">
        <div class="form-card">
            <h2>重設密碼</h2>

            <form id="reset-form" hidden>
                <label>
                    新密碼（至少 8 個字）
                    <input type="password" id="new-password" required minlength="8" autocomplete="new-password">
                </label>
                <label>
                    再輸入一次新密碼
                    <input type="password" id="new-password-again" required minlength="8" autocomplete="new-password">
                </label>
                <button type="submit" class="primary-button">儲存新密碼</button>
            </form>

            <p id="form-message" class="form-message" hidden></p>
        </div>
    </main>

    <footer>
        <p>♡ usiann・二手收藏分享 ♡</p>
    </footer>

    <!-- Supabase 工具（固定版本，避免它自己更新後網站壞掉） -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
    <script src="common.js?v=6"></script>

    <script>
        const resetForm = document.getElementById("reset-form");
        const message = document.getElementById("form-message");

        // 從重設密碼信的連結進來時，會暫時登入，才能改密碼
        getCurrentUser().then(function(user) {
            if (user) {
                resetForm.hidden = false;
            } else {
                showMessage(
                    message,
                    "這個連結已經失效了，請到登入頁按「忘記密碼？」重新申請",
                    "error"
                );
            }
        });

        resetForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const password = document.getElementById("new-password").value;
            const passwordAgain = document.getElementById("new-password-again").value;

            if (password !== passwordAgain) {
                showMessage(message, "兩次輸入的密碼不一樣", "error");
                return;
            }

            const { error } = await db.auth.updateUser({ password: password });

            if (error) {
                showMessage(message, translateError(error), "error");
                return;
            }

            resetForm.hidden = true;
            showMessage(message, "密碼已更新 ♡ 正在帶你回首頁…", "success");
            setTimeout(function() {
                window.location.href = "index.html";
            }, 2000);
        });
    </script>

</body>
</html>
