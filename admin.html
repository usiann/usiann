<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理頁｜usiann</title>
    <link rel="stylesheet" href="style.css?v=11">
</head>

<body>

    <!-- 網站標題（點了回首頁） -->
    <header>
        <div id="user-menu" class="user-menu"></div>
        <h1><a href="index.html" class="home-link">usiann ⋆˚꩜｡</a></h1>
        <p>有啥？</p>
    </header>

    <main class="form-page">
        <div class="admin-page">

            <p id="loading" class="form-hint">讀取中…</p>
            <p id="page-message" class="form-message" hidden></p>

            <div id="admin-content" hidden>

                <!-- 快速跳到各區 -->
                <nav class="admin-jump">
                    <a href="#pending-section" id="jump-pending">待審核</a>
                    <a href="#reports-section" id="jump-reports">被檢舉</a>
                    <a href="#messages-section" id="jump-messages">聯絡訊息</a>
                    <a href="#sellers-section">賣家管理</a>
                </nav>

                <!-- ===== 等待審核的商品 ===== -->
                <section id="pending-section" class="admin-section">
                    <h2 id="pending-title">等待審核的商品</h2>
                    <p id="pending-empty" class="empty-hint" hidden>目前沒有等待審核的商品 ♡</p>
                    <div id="pending-list"></div>
                </section>

                <!-- ===== 被檢舉的商品 ===== -->
                <section id="reports-section" class="admin-section">
                    <h2 id="reports-title">被檢舉的商品</h2>
                    <p id="reports-empty" class="empty-hint" hidden>目前沒有被檢舉的商品 ♡</p>
                    <div id="reports-list"></div>
                </section>

                <!-- ===== 聯絡我們的訊息 ===== -->
                <section id="messages-section" class="admin-section">
                    <h2 id="messages-title">聯絡我們的訊息</h2>
                    <p id="messages-empty" class="empty-hint" hidden>目前沒有未處理的訊息 ♡</p>
                    <div id="messages-list"></div>
                </section>

                <!-- ===== 賣家管理 ===== -->
                <section id="sellers-section" class="admin-section">
                    <h2>賣家管理</h2>
                    <form id="seller-search" class="admin-search">
                        <input type="text" id="seller-keyword" placeholder="輸入暱稱或 email 搜尋（空白會列出最新的 50 位）">
                        <button type="submit" class="small-button">搜尋</button>
                    </form>
                    <div id="seller-list"></div>
                </section>

            </div>
        </div>
    </main>

    <footer>
        <p>♡ usiann・二手收藏分享 ♡</p>
    </footer>

    <!-- Supabase 工具（固定版本，避免它自己更新後網站壞掉） -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
    <script src="common.js?v=9"></script>

    <script>
        // 退回時可以直接點選的原因
        // 想新增或修改原因，改這裡就好
        const REJECT_REASONS = [
            "照片不清楚",
            "現貨沒有使用實品照片",
            "盜用其他賣家的照片",
            "疑似仿冒品",
            "商品資訊不完整",
            "預購、代購沒有寫出貨時間",
            "賣貨便連結有問題",
            "屬於禁止刊登的商品",
            "不符合使用規範"
        ];

        const pageMessage = document.getElementById("page-message");
        let currentUser = null;


        // ===== 開始：先確認是管理員 =====
        async function init() {
            currentUser = await requireLogin();
            if (!currentUser) {
                return;
            }

            const profile = await getMyProfile();
            document.getElementById("loading").hidden = true;

            // 不是管理員就什麼都不顯示
            // （就算有人改了這裡的程式，資料庫也不會讓他審核）
            if (!profile || !profile.is_admin) {
                showMessage(pageMessage, "這一頁只有管理員可以使用", "error");
                return;
            }

            document.getElementById("admin-content").hidden = false;
            loadPending();
            loadReports();
            loadMessages();
            loadSellers("");
        }

        init();


        // =====================================================
        // 等待審核的商品
        // =====================================================
        async function loadPending() {
            const { data, error } = await db
                .from("products")
                .select("id, name, category, condition, price, description, link, images, created_at, sale_type, seller:profiles(nickname, seller_level)")
                .eq("status", "pending")
                .order("created_at", { ascending: true });

            if (error) {
                showMessage(pageMessage, translateError(error), "error");
                return;
            }

            document.getElementById("pending-title").textContent =
                "等待審核的商品（" + data.length + " 件）";
            document.getElementById("jump-pending").textContent = "待審核 " + data.length;
            document.getElementById("pending-empty").hidden = data.length > 0;

            const list = document.getElementById("pending-list");
            list.textContent = "";
            data.forEach(function(product) {
                list.appendChild(makeReviewCard(product));
            });
        }

        // 做出一張審核卡片
        function makeReviewCard(product) {
            const card = document.createElement("div");
            card.className = "review-card";

            // 所有照片（點了用新分頁看大圖）
            const gallery = document.createElement("div");
            gallery.className = "review-photos";
            product.images.forEach(function(path, index) {
                const link = document.createElement("a");
                link.href = getImageUrl(path);
                link.target = "_blank";
                link.rel = "noopener noreferrer";

                const img = document.createElement("img");
                img.src = getImageUrl(path);
                img.alt = product.name + " 照片 " + (index + 1);

                link.appendChild(img);
                gallery.appendChild(link);
            });

            const name = document.createElement("h3");
            name.textContent = product.name;

            const details = document.createElement("dl");
            details.className = "account-info";
            addDetail(details, "賣家",
                (product.seller ? product.seller.nickname : "？") + "（" +
                (product.seller && product.seller.seller_level === "trusted" ? "🌷 信任賣家" : "🌱 新手賣家") + "）");
            addDetail(details, "角色分類", getCategoryName(product.category));
            addDetail(details, "商品類型",
                getSaleTypeName(product.sale_type) +
                (product.sale_type === "in_stock" ? "（照片要是實品）" : "（可用官方照片，說明要有出貨時間）"));
            addDetail(details, "商品狀況", product.condition);
            addDetail(details, "價格", "NT$ " + product.price);
            addDetail(details, "送出時間", new Date(product.created_at).toLocaleString("zh-TW"));

            // 賣貨便連結（點了用新分頁打開，確認賣場是真的）
            const linkDt = document.createElement("dt");
            linkDt.textContent = "賣貨便";
            const linkDd = document.createElement("dd");
            const shopLink = document.createElement("a");
            shopLink.href = product.link;
            shopLink.target = "_blank";
            shopLink.rel = "noopener noreferrer";
            shopLink.textContent = product.link;
            linkDd.appendChild(shopLink);
            details.append(linkDt, linkDd);

            const description = document.createElement("p");
            description.className = "review-description";
            description.textContent = product.description || "（沒有填寫說明）";

            // 審核按鈕
            const actions = document.createElement("div");
            actions.className = "product-row-actions";

            const approveButton = document.createElement("button");
            approveButton.type = "button";
            approveButton.className = "small-button";
            approveButton.textContent = "✅ 通過";

            const rejectButton = document.createElement("button");
            rejectButton.type = "button";
            rejectButton.className = "small-button danger";
            rejectButton.textContent = "❌ 退回";

            actions.append(approveButton, rejectButton);

            // 退回原因（按「退回」才會出現）
            const rejectBox = document.createElement("div");
            rejectBox.className = "reject-box";
            rejectBox.hidden = true;

            const reasonSelect = document.createElement("select");
            REJECT_REASONS.forEach(function(reason) {
                reasonSelect.add(new Option(reason, reason));
            });
            reasonSelect.add(new Option("其他（自己寫）", "其他"));

            const reasonInput = document.createElement("input");
            reasonInput.type = "text";
            reasonInput.maxLength = 200;
            reasonInput.placeholder = "補充說明（選「其他」時一定要寫）";

            const confirmReject = document.createElement("button");
            confirmReject.type = "button";
            confirmReject.className = "small-button danger";
            confirmReject.textContent = "確定退回";

            rejectBox.append(reasonSelect, reasonInput, confirmReject);

            const cardMessage = document.createElement("p");
            cardMessage.className = "form-message";
            cardMessage.hidden = true;

            approveButton.addEventListener("click", function() {
                review(product, true, null, card, cardMessage);
            });

            rejectButton.addEventListener("click", function() {
                rejectBox.hidden = !rejectBox.hidden;
            });

            confirmReject.addEventListener("click", function() {
                const extra = reasonInput.value.trim();
                let reason;
                if (reasonSelect.value === "其他") {
                    if (extra === "") {
                        showMessage(cardMessage, "選「其他」時，請寫下退回的原因", "error");
                        return;
                    }
                    reason = extra;
                } else {
                    reason = extra ? reasonSelect.value + "：" + extra : reasonSelect.value;
                }
                review(product, false, reason, card, cardMessage);
            });

            card.append(gallery, name, details, description, actions, rejectBox, cardMessage);
            return card;
        }

        function addDetail(list, label, value) {
            const dt = document.createElement("dt");
            dt.textContent = label;
            const dd = document.createElement("dd");
            dd.textContent = value;
            list.append(dt, dd);
        }

        // 送出審核結果
        async function review(product, approve, reason, card, cardMessage) {
            card.querySelectorAll("button").forEach(function(button) {
                button.disabled = true;
            });

            const { error } = await db.rpc("admin_review_product", {
                target_id: product.id,
                approve: approve,
                reason: reason
            });

            if (error) {
                card.querySelectorAll("button").forEach(function(button) {
                    button.disabled = false;
                });
                showMessage(cardMessage, translateError(error), "error");
                return;
            }

            showMessage(
                pageMessage,
                (approve ? "已通過「" : "已退回「") + product.name + "」",
                "success"
            );
            loadPending();
            loadSellers(document.getElementById("seller-keyword").value);
        }


        // =====================================================
        // 被檢舉的商品
        // =====================================================
        async function loadReports() {
            const { data, error } = await db
                .from("reports")
                .select("id, reasons, other_reason, details, created_at, reporter:profiles(nickname), product:products(id, name, status, images, seller_id, seller:profiles(nickname))")
                .order("created_at", { ascending: true });

            if (error) {
                showMessage(pageMessage, translateError(error), "error");
                return;
            }

            // 把同一個商品的檢舉放在一起
            // 已經下架的商品不用再處理，不顯示
            const groups = new Map();
            data.forEach(function(report) {
                const product = report.product;
                if (!product || product.status === "removed") {
                    return;
                }
                if (!groups.has(product.id)) {
                    groups.set(product.id, { product: product, reports: [] });
                }
                groups.get(product.id).reports.push(report);
            });

            // 被檢舉越多次的排越前面
            const list = Array.from(groups.values()).sort(function(a, b) {
                return b.reports.length - a.reports.length;
            });

            document.getElementById("reports-title").textContent =
                "被檢舉的商品（" + list.length + " 件）";
            document.getElementById("jump-reports").textContent = "被檢舉 " + list.length;
            document.getElementById("reports-empty").hidden = list.length > 0;

            const container = document.getElementById("reports-list");
            container.textContent = "";
            list.forEach(function(group) {
                container.appendChild(makeReportCard(group.product, group.reports));
            });
        }

        function makeReportCard(product, reports) {
            const card = document.createElement("div");
            card.className = "review-card";

            // 商品照片和名稱（點了用新分頁看商品頁）
            const header = document.createElement("div");
            header.className = "report-header";

            const img = document.createElement("img");
            img.src = getImageUrl(product.images[0]);
            img.alt = product.name;

            const titleBox = document.createElement("div");

            const name = document.createElement("a");
            name.href = "product.html?id=" + product.id;
            name.target = "_blank";
            name.rel = "noopener";
            name.className = "seller-link";
            name.textContent = product.name;

            const info = document.createElement("p");
            info.className = "status";
            info.textContent =
                "賣家：" + (product.seller ? product.seller.nickname : "—") +
                "・" + reports.length + " 人檢舉" +
                (product.status === "hidden" ? "・⏸️ 已自動隱藏" : "・目前仍公開");

            titleBox.append(name, info);
            header.append(img, titleBox);

            // 每一筆檢舉
            const reportList = document.createElement("ul");
            reportList.className = "report-list";
            reports.forEach(function(report) {
                const item = document.createElement("li");

                const reasons = report.reasons.map(function(reason) {
                    return reason === "其他" ? "其他：" + report.other_reason : reason;
                }).join("、");

                const reasonLine = document.createElement("strong");
                reasonLine.textContent = reasons;

                const meta = document.createElement("span");
                meta.className = "report-meta";
                meta.textContent =
                    "（" + (report.reporter ? report.reporter.nickname : "—") + "・" +
                    new Date(report.created_at).toLocaleString("zh-TW") + "）";

                item.append(reasonLine, meta);

                if (report.details) {
                    const details = document.createElement("p");
                    details.textContent = report.details;
                    item.appendChild(details);
                }

                reportList.appendChild(item);
            });

            // 處理按鈕
            const actions = document.createElement("div");
            actions.className = "product-row-actions";

            const cardMessage = document.createElement("p");
            cardMessage.className = "form-message";
            cardMessage.hidden = true;

            const choices = [
                { action: "dismiss", text: "✅ 檢舉不成立", className: "small-button" },
                { action: "remove", text: "🚫 下架商品", className: "small-button danger" },
                { action: "ban", text: "⛔ 下架並停權賣家", className: "small-button danger" }
            ];

            choices.forEach(function(choice) {
                const button = document.createElement("button");
                button.type = "button";
                button.className = choice.className;
                button.textContent = choice.text;
                button.addEventListener("click", function() {
                    handleReport(product, choice.action, card, cardMessage);
                });
                actions.appendChild(button);
            });

            card.append(header, reportList, actions, cardMessage);
            return card;
        }

        async function handleReport(product, action, card, cardMessage) {
            const sellerName = product.seller ? product.seller.nickname : "這位賣家";
            const confirmText = {
                dismiss: "確定「" + product.name + "」的檢舉不成立嗎？\n商品會恢復公開，檢舉紀錄會清掉。",
                remove: "確定要下架「" + product.name + "」嗎？\n" + sellerName + " 的違規次數會 +1，並降回新手賣家。",
                ban: "確定要下架「" + product.name + "」並停權「" + sellerName + "」嗎？\n他所有的商品都會下架，之後也不能再上架。"
            };

            if (!window.confirm(confirmText[action])) {
                return;
            }

            card.querySelectorAll("button").forEach(function(button) {
                button.disabled = true;
            });

            const { error } = await db.rpc("admin_handle_report", {
                target_id: product.id,
                action: action
            });

            if (error) {
                card.querySelectorAll("button").forEach(function(button) {
                    button.disabled = false;
                });
                showMessage(cardMessage, translateError(error), "error");
                return;
            }

            const doneText = {
                dismiss: "已處理：「" + product.name + "」檢舉不成立，商品恢復公開",
                remove: "已下架「" + product.name + "」",
                ban: "已下架「" + product.name + "」並停權「" + sellerName + "」"
            };
            showMessage(pageMessage, doneText[action], "success");
            loadReports();
            loadSellers(document.getElementById("seller-keyword").value);
        }


        // =====================================================
        // 聯絡我們的訊息（只顯示還沒處理的）
        // =====================================================
        async function loadMessages() {
            const { data, error } = await db
                .from("contact_messages")
                .select("id, topics, subject, message, email, user_id, created_at")
                .eq("handled", false)
                .order("created_at", { ascending: true });

            if (error) {
                showMessage(pageMessage, translateError(error), "error");
                return;
            }

            document.getElementById("messages-title").textContent =
                "聯絡我們的訊息（" + data.length + " 則未處理）";
            document.getElementById("jump-messages").textContent = "聯絡訊息 " + data.length;
            document.getElementById("messages-empty").hidden = data.length > 0;

            const container = document.getElementById("messages-list");
            container.textContent = "";
            data.forEach(function(item) {
                container.appendChild(makeMessageCard(item));
            });
        }

        function makeMessageCard(item) {
            const card = document.createElement("div");
            card.className = "review-card";

            const subject = document.createElement("h3");
            subject.textContent = item.subject;

            const details = document.createElement("dl");
            details.className = "account-info";
            addDetail(details, "問題方向", (item.topics || []).join("、"));
            addDetail(details, "Email", item.email);
            addDetail(details, "會員", item.user_id ? "有登入的會員" : "沒有登入");
            addDetail(details, "時間", new Date(item.created_at).toLocaleString("zh-TW"));

            const content = document.createElement("p");
            content.className = "review-description";
            content.textContent = item.message;

            const doneButton = document.createElement("button");
            doneButton.type = "button";
            doneButton.className = "small-button";
            doneButton.textContent = "✅ 標示已處理";
            doneButton.addEventListener("click", async function() {
                doneButton.disabled = true;
                const { error } = await db
                    .from("contact_messages")
                    .update({ handled: true })
                    .eq("id", item.id);
                if (error) {
                    doneButton.disabled = false;
                    showMessage(pageMessage, translateError(error), "error");
                    return;
                }
                loadMessages();
            });

            card.append(subject, details, content, doneButton);
            return card;
        }


        // =====================================================
        // 賣家管理
        // =====================================================
        document.getElementById("seller-search").addEventListener("submit", function(event) {
            event.preventDefault();
            loadSellers(document.getElementById("seller-keyword").value);
        });

        async function loadSellers(keyword) {
            const { data, error } = await db.rpc("admin_list_sellers", {
                search: keyword.trim()
            });

            const list = document.getElementById("seller-list");
            list.textContent = "";

            if (error) {
                showMessage(pageMessage, translateError(error), "error");
                return;
            }

            if (data.length === 0) {
                const empty = document.createElement("p");
                empty.className = "empty-hint";
                empty.textContent = "找不到符合的賣家";
                list.appendChild(empty);
                return;
            }

            data.forEach(function(seller) {
                list.appendChild(makeSellerRow(seller));
            });
        }

        function makeSellerRow(seller) {
            const row = document.createElement("div");
            row.className = "product-row";

            const info = document.createElement("div");
            info.className = "product-row-info";

            const name = document.createElement("h3");
            name.textContent = seller.nickname + (seller.is_admin ? "（管理員）" : "");

            const email = document.createElement("p");
            email.textContent = seller.email;

            const level = document.createElement("p");
            level.className = "status";
            level.textContent =
                (seller.seller_level === "trusted" ? "🌷 信任賣家" : "🌱 新手賣家") +
                "・通過審核 " + seller.approved_count + " 件" +
                "・違規 " + seller.violation_count + " 次" +
                (seller.is_banned ? "・🚫 已停權" : "");

            info.append(name, email, level);

            const actions = document.createElement("div");
            actions.className = "product-row-actions";

            const levelButton = document.createElement("button");
            levelButton.type = "button";
            levelButton.className = "small-button";
            const isTrusted = seller.seller_level === "trusted";
            levelButton.textContent = isTrusted ? "降回新手賣家" : "升級為信任賣家";
            levelButton.addEventListener("click", async function() {
                levelButton.disabled = true;
                const { error } = await db.rpc("admin_set_seller_level", {
                    target_id: seller.id,
                    new_level: isTrusted ? "new" : "trusted"
                });
                if (error) {
                    levelButton.disabled = false;
                    showMessage(pageMessage, translateError(error), "error");
                    return;
                }
                showMessage(pageMessage, "已調整「" + seller.nickname + "」的等級", "success");
                loadSellers(document.getElementById("seller-keyword").value);
            });
            actions.appendChild(levelButton);

            // 停權／解除停權（不能停權自己）
            if (seller.id !== currentUser.id) {
                const banButton = document.createElement("button");
                banButton.type = "button";
                banButton.className = "small-button danger";
                banButton.textContent = seller.is_banned ? "解除停權" : "停權";
                banButton.addEventListener("click", async function() {
                    const willBan = !seller.is_banned;
                    const question = willBan
                        ? "確定要停權「" + seller.nickname + "」嗎？\n他所有的商品都會下架，之後也不能再上架。"
                        : "確定要解除「" + seller.nickname + "」的停權嗎？\n之前被下架的商品不會自動恢復。";
                    if (!window.confirm(question)) {
                        return;
                    }

                    banButton.disabled = true;
                    const { error } = await db.rpc("admin_set_banned", {
                        target_id: seller.id,
                        banned: willBan
                    });
                    if (error) {
                        banButton.disabled = false;
                        showMessage(pageMessage, translateError(error), "error");
                        return;
                    }
                    showMessage(
                        pageMessage,
                        (willBan ? "已停權「" : "已解除停權「") + seller.nickname + "」",
                        "success"
                    );
                    loadSellers(document.getElementById("seller-keyword").value);
                    loadReports();
                });
                actions.appendChild(banButton);
            }

            row.append(info, actions);
            return row;
        }
    </script>

</body>
</html>
