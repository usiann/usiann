<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品｜usiann</title>
    <link rel="stylesheet" href="style.css?v=10">
</head>

<body>

    <!-- 網站標題（點了回首頁） -->
    <header>
        <div id="user-menu" class="user-menu"></div>
        <h1><a href="index.html" class="home-link">usiann ⋆˚꩜｡</a></h1>
        <p>有啥？</p>
    </header>

    <main class="product-page">

        <p><a href="index.html" class="text-button">← 回到商品列表</a></p>

        <p id="loading" class="no-results">讀取中…</p>
        <p id="not-found" class="no-results" hidden>找不到這個商品，可能已經被刪除或下架了 ♡</p>

        <div id="product" class="product-layout" hidden>

            <!-- 照片 -->
            <div class="gallery">
                <div id="gallery-main" class="gallery-main">
                    <img id="main-image" alt="">
                </div>
                <div id="gallery-thumbs" class="gallery-thumbs"></div>
            </div>

            <!-- 商品資料 -->
            <div class="product-info">
                <p id="status-banner" class="status-banner" hidden></p>

                <h2 id="product-name"></h2>

                <div class="product-tags">
                    <a id="product-category" class="tag" href="#"></a>
                    <span id="product-condition" class="tag"></span>
                </div>

                <p id="product-price" class="product-price"></p>

                <p id="product-description" class="product-description"></p>

                <p id="product-seller" class="product-seller"></p>
                <p id="product-date" class="product-seller"></p>

                <div class="product-actions">
                    <!-- target="_blank"：用新分頁打開 -->
                    <!-- rel="noopener noreferrer"：讓打開的外部網站不能動到我們的網頁，比較安全 -->
                    <a
                        id="buy-button"
                        class="buy-button"
                        target="_blank"
                        rel="noopener noreferrer"
                    >前往賣貨便購買</a>

                    <!-- 「♡ 加入收藏」按鈕會由程式放進這裡 -->
                    <div id="favorite-slot"></div>

                    <button type="button" id="share-button" class="secondary-button">分享這個商品</button>

                    <!-- 收藏人數 -->
                    <p id="favorite-count" class="favorite-count" hidden></p>
                </div>

                <p id="share-message" class="form-message" hidden></p>

                <!-- 檢舉此商品：點了跳出檢舉視窗（自己的商品不會顯示） -->
                <button type="button" id="report-button" class="report-button text-button" hidden>檢舉此商品</button>
            </div>

        </div>
    </main>

    <!-- ===== 檢舉視窗 ===== -->
    <dialog id="report-dialog" class="report-dialog">
        <form id="report-form" class="report-form">
            <h2>檢舉商品</h2>
            <p id="report-product-name" class="form-hint"></p>

            <fieldset>
                <legend>發生什麼事？（可以勾很多個）</legend>
                <!-- 勾選項目由下方程式產生 -->
                <div id="report-reasons" class="report-reasons"></div>
            </fieldset>

            <label>
                詳細說明（可以不寫，最多 500 個字）
                <textarea id="report-details" rows="4" maxlength="500"
                    placeholder="例如：標籤的字體和正版不一樣"></textarea>
            </label>

            <p id="report-message" class="form-message" hidden></p>

            <div class="dialog-actions">
                <button type="button" id="report-cancel" class="secondary-button">取消</button>
                <button type="submit" id="report-submit" class="primary-button">送出檢舉</button>
            </div>
        </form>
    </dialog>

    <footer>
        <p>♡ usiann・二手收藏分享 ♡</p>

        <!-- 免責聲明 -->
        <div class="disclaimer">
            <p>
                本網站僅提供二手商品資訊的刊登與曝光，
                不參與買賣雙方的交易，包含付款、物流、商品品質與真偽保證。
            </p>
            <p>
                商品皆由賣家自行刊登，如發現仿冒品或可疑商品，
                歡迎點選商品頁中的「檢舉此商品」告訴我們 ♡
            </p>
        </div>
    </footer>

    <!-- Supabase 工具（固定版本，避免它自己更新後網站壞掉） -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
    <script src="common.js?v=8"></script>

    <script>
        // 商品不是「已公開」時（只有賣家本人和管理員看得到），上面顯示的提醒
        const STATUS_BANNER = {
            pending: "🕐 這個商品正在等待審核，其他人還看不到",
            rejected: "❌ 這個商品沒有通過審核，其他人看不到",
            hidden: "⏸️ 這個商品因為被檢舉，暫時隱藏中",
            removed: "🚫 這個商品已被管理員下架"
        };

        async function loadProduct() {
            const productId = new URLSearchParams(window.location.search).get("id");

            let product = null;
            if (productId) {
                const { data } = await db
                    .from("products")
                    .select("id, name, category, condition, price, description, link, images, status, is_sold, created_at, seller_id, seller:profiles(nickname, seller_level)")
                    .eq("id", productId)
                    .maybeSingle();
                product = data;
            }

            document.getElementById("loading").hidden = true;

            if (!product) {
                document.getElementById("not-found").hidden = false;
                return;
            }

            document.title = product.name + "｜usiann";

            // 不是公開狀態時的提醒
            if (product.status !== "published") {
                const banner = document.getElementById("status-banner");
                banner.textContent = STATUS_BANNER[product.status] || "";
                banner.hidden = false;
            }

            // 照片
            showPhoto(product, 0);
            const thumbs = document.getElementById("gallery-thumbs");
            if (product.images.length > 1) {
                product.images.forEach(function(path, index) {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.setAttribute("aria-label", "看第 " + (index + 1) + " 張照片");

                    const img = document.createElement("img");
                    img.src = getImageUrl(path);
                    img.alt = "";
                    button.appendChild(img);

                    button.addEventListener("click", function() {
                        showPhoto(product, index);
                    });
                    thumbs.appendChild(button);
                });
                markActiveThumb(0);
            }

            // 已售出：照片蓋上 SOLD OUT
            if (product.is_sold) {
                const overlay = document.createElement("div");
                overlay.className = "sold-overlay";
                overlay.setAttribute("role", "img");
                overlay.setAttribute("aria-label", "已售出");
                document.getElementById("gallery-main").appendChild(overlay);
            }

            // 文字資料
            document.getElementById("product-name").textContent = product.name;

            const categoryTag = document.getElementById("product-category");
            categoryTag.textContent = getCategoryName(product.category);
            categoryTag.href = "index.html?category=" + product.category;

            document.getElementById("product-condition").textContent = product.condition;
            document.getElementById("product-price").textContent =
                "NT$ " + product.price.toLocaleString("zh-TW");
            document.getElementById("product-description").textContent =
                product.description || "賣家沒有填寫說明";

            // 賣家：名字可以點，點了到賣家頁
            const seller = product.seller;
            const sellerLine = document.getElementById("product-seller");
            const sellerLink = document.createElement("a");
            sellerLink.href = "seller.html?id=" + product.seller_id;
            sellerLink.className = "seller-link";
            sellerLink.textContent = seller ? seller.nickname : "查看賣家";
            sellerLine.append("賣家：", sellerLink);
            if (seller && seller.seller_level === "trusted") {
                sellerLine.append("（🌷 信任賣家）");
            }
            document.getElementById("product-date").textContent =
                "上架日期：" + new Date(product.created_at).toLocaleDateString("zh-TW");

            // 購買按鈕：已售出就不能按
            const buyButton = document.getElementById("buy-button");
            if (product.is_sold) {
                buyButton.textContent = "已售出";
                buyButton.classList.add("disabled");
                buyButton.setAttribute("aria-disabled", "true");
            } else {
                buyButton.href = product.link;
            }

            // 收藏按鈕和收藏人數（只有公開的商品可以收藏）
            if (product.status === "published") {
                const { data: count } = await db.rpc("favorite_count", { target_id: product.id });
                let favoriteCount = count || 0;
                showFavoriteCount(favoriteCount);

                const favoriteButton = makeFavoriteButton(product.id, true, function(isFavorite) {
                    favoriteCount += isFavorite ? 1 : -1;
                    showFavoriteCount(favoriteCount);
                });
                document.getElementById("favorite-slot").appendChild(favoriteButton);
            }

            // 檢舉按鈕：公開的商品才能檢舉，自己的商品不顯示
            const user = await getCurrentUser();
            const isMine = user && user.id === product.seller_id;
            if (product.status === "published" && !isMine) {
                currentProduct = product;
                document.getElementById("report-button").hidden = false;
            }

            document.getElementById("product").hidden = false;
        }

        // 顯示「♥ N 人收藏」，0 人時不顯示
        function showFavoriteCount(count) {
            const element = document.getElementById("favorite-count");
            element.textContent = "♥ " + count + " 人收藏";
            element.hidden = count <= 0;
        }

        // 切換大照片
        function showPhoto(product, index) {
            const mainImage = document.getElementById("main-image");
            mainImage.src = getImageUrl(product.images[index]);
            mainImage.alt = product.name + " 照片 " + (index + 1);
            markActiveThumb(index);
        }

        function markActiveThumb(index) {
            document.querySelectorAll("#gallery-thumbs button").forEach(function(button, i) {
                button.classList.toggle("active", i === index);
            });
        }

        loadProduct();


        // =====================================================
        // 檢舉
        // =====================================================

        // 檢舉原因
        // ⚠️ 要跟資料庫 05_reports.sql 裡的原因一樣，「其他」要放最後
        const REPORT_REASONS = [
            "疑似仿冒品",
            "商品資訊和實際不符",
            "賣貨便連結打不開",
            "價格異常",
            "不當內容",
            "其他"
        ];

        // 正在看的商品（檢舉時要用）
        let currentProduct = null;

        const reportDialog = document.getElementById("report-dialog");
        const reportForm = document.getElementById("report-form");
        const reportMessage = document.getElementById("report-message");

        // 產生勾選項目
        const reasonsBox = document.getElementById("report-reasons");
        let otherInput = null;
        let otherCheckbox = null;

        REPORT_REASONS.forEach(function(reason) {
            const label = document.createElement("label");
            label.className = "checkbox-label";

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.value = reason;
            label.appendChild(checkbox);

            if (reason === "其他") {
                // 其他：＿＿＿＿（打字時自動勾起來）
                label.append("其他：");
                otherInput = document.createElement("input");
                otherInput.type = "text";
                otherInput.maxLength = 100;
                otherInput.className = "other-input";
                otherInput.setAttribute("aria-label", "其他原因");
                otherInput.addEventListener("input", function() {
                    otherCheckbox.checked = otherInput.value.trim() !== "";
                });
                otherCheckbox = checkbox;
                label.appendChild(otherInput);
            } else {
                label.append(reason);
            }

            reasonsBox.appendChild(label);
        });

        // 按「檢舉此商品」
        document.getElementById("report-button").addEventListener("click", async function() {
            const user = await getCurrentUser();
            if (!user) {
                if (window.confirm("登入後才能檢舉喔 ♡\n要現在去登入嗎？")) {
                    window.location.href = "login.html";
                }
                return;
            }

            reportForm.reset();
            reportMessage.hidden = true;
            document.getElementById("report-submit").hidden = false;
            document.getElementById("report-cancel").textContent = "取消";
            document.getElementById("report-product-name").textContent = "商品：" + currentProduct.name;
            reportDialog.showModal();
        });

        // 關閉視窗：按「取消」或點視窗外面
        document.getElementById("report-cancel").addEventListener("click", function() {
            reportDialog.close();
        });
        reportDialog.addEventListener("click", function(event) {
            if (event.target === reportDialog) {
                reportDialog.close();
            }
        });

        // 送出檢舉
        reportForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const reasons = Array.from(reasonsBox.querySelectorAll("input[type=checkbox]:checked"))
                .map(function(checkbox) { return checkbox.value; });
            const otherReason = otherInput.value.trim();

            if (reasons.length === 0) {
                showMessage(reportMessage, "請至少勾選一個原因", "error");
                return;
            }
            if (reasons.includes("其他") && otherReason === "") {
                showMessage(reportMessage, "選「其他」時，請寫下原因", "error");
                return;
            }

            const submitButton = document.getElementById("report-submit");
            submitButton.disabled = true;

            const { error } = await db.from("reports").insert({
                product_id: currentProduct.id,
                reasons: reasons,
                other_reason: reasons.includes("其他") ? otherReason : "",
                details: document.getElementById("report-details").value.trim()
            });

            submitButton.disabled = false;

            if (error) {
                // 23505 = 已經檢舉過了
                if (error.code === "23505") {
                    showMessage(reportMessage, "你已經檢舉過這個商品了，我們會盡快確認 ♡", "success");
                } else {
                    showMessage(reportMessage, translateError(error), "error");
                    return;
                }
            } else {
                showMessage(reportMessage, "已收到你的檢舉，謝謝你幫忙維護安全的收藏環境 ♡", "success");

                // 寄一份通知到管理員的 Gmail（只寫暱稱，不寫檢舉人的 email）
                const reasonText = reasons.map(function(reason) {
                    return reason === "其他" ? "其他：" + otherReason : reason;
                }).join("、");
                const reporter = await getMyProfile();
                const details = document.getElementById("report-details").value.trim();

                sendEmailNotice({
                    subject: "[檢舉] " + currentProduct.name,
                    "商品": currentProduct.name,
                    "商品網址": SITE_BASE + "product.html?id=" + currentProduct.id,
                    "檢舉原因": reasonText,
                    "詳細說明": details || "（沒有寫）",
                    "檢舉人": reporter ? reporter.nickname : "—",
                    "到管理頁處理": SITE_BASE + "admin.html#reports-section",
                    message: "有人檢舉了「" + currentProduct.name + "」，原因：" + reasonText
                });
            }

            // 送出後只留「關閉」按鈕
            submitButton.hidden = true;
            document.getElementById("report-cancel").textContent = "關閉";
        });


        // ===== 分享 =====
        // 手機：打開手機內建的分享選單（可以分享到 LINE、IG 等）
        // 電腦：直接複製網址
        document.getElementById("share-button").addEventListener("click", async function() {
            const shareMessage = document.getElementById("share-message");
            const url = window.location.href;

            if (navigator.share) {
                try {
                    await navigator.share({ title: document.title, url: url });
                } catch (error) {
                    // 使用者自己取消分享，不用處理
                }
                return;
            }

            try {
                await navigator.clipboard.writeText(url);
                showMessage(shareMessage, "已複製商品網址，可以貼給朋友了 ♡", "success");
            } catch (error) {
                showMessage(shareMessage, "複製失敗，請直接複製瀏覽器上方的網址", "error");
            }
        });
    </script>

</body>
</html>
